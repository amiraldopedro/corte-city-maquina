# ============================================================
#  MÁQUINA DE CORTES GTA 6 — configuração
#  Tudo que você quiser mudar no dia a dia fica aqui.
# ============================================================

# Jogos aceitos (nome exato da categoria na Twitch). Clipes de outros jogos são ignorados.
jogos:
  - "Grand Theft Auto VI"
  - "Grand Theft Auto V"     # GTA RP. Tire as linhas abaixo quando o GTA 6 dominar as lives
  - "Grand Theft Auto: San Andreas"
  - "Grand Theft Auto IV"
  - "Red Dead Redemption 2"

# Aquecimento até o lançamento (19/11): clipes de conversa/react só entram
# se o título do clipe falar de GTA. Depois do lançamento pode apagar este bloco.
jogos_com_palavra:
  jogos: ["Just Chatting", "IRL"]
  palavras: ["gta", "rockstar", "trailer", "vice city", "leonida", "lucia", "jason", "pré-carregamento", "pre load", "preload"]

# Shorts de notícia do GTA 6 (Google Notícias + posts do X que você colar no painel)
# Vazamento e conteúdo adulto/sensível são barrados (filtro de palavras + IA).
noticias:
  termos: ["GTA 6", "GTA VI", "Rockstar GTA"]
  por_dia: 0                     # notícias do Google por dia: 0 = desligado (davam 0 a 2 views). Posts do X que você colar continuam
  horarios: ["10:30", "20:30"]
  modelo: "qwen2.5:7b"           # IA maior só pras notícias: escreve português melhor

# Robô automático do YouTube: todo dia a máquina acha sozinha os vídeos de GTA mais vistos do YouTube BR
# e põe na fila do robô do Mac (que baixa só os melhores trechos). Você não precisa colar link.
youtube_auto:
  ligado: true
  por_dia: 2                     # vídeos novos por dia (cada um vira ~3 Shorts + 1 corte longo)
  dias: 30                       # publicados nos últimos X dias
  min_views: 50000
  termos: ["GTA 6 react", "reagindo GTA 6"]
  # Lives de GTA 6 que TERMINARAM (de qualquer canal BR, não só os streamers da lista).
  # O robô do Mac acha os melhores trechos sozinho (mais repetidos + picos de volume).
  lives:
    ligado: true
    por_dia: 3
    horas: 48          # lives encerradas nas últimas X horas
    min_views: 20000
    termos: ["GTA 6"]

# Shorts em alta -> versão Corte City: acha os Shorts de GTA 6 mais virais (qualquer idioma),
# tira a voz original, narra em português (adaptado, não literal) e credita o canal original.
modelar:
  ligado: true
  por_dia: 3
  dias: 4              # viralizou nos últimos X dias
  min_views: 150000
  max_seg: 75
  termos: ["GTA 6", "GTA 6 gameplay"]
  voz: "pt-BR-AntonioNeural"
  # TikToks estourados tambem viram modelo (o robô do Mac caça e baixa; Reels/X entram por link manual)
  tiktok:
    ligado: true
    por_dia: 2
    dias: 5
    min_views: 500000
    tags: ["gta6", "gta6brasil"]   # a caça por tag liga sozinha quando o yt-dlp consertar o extrator
    contas: []                     # @perfis de clipes de GTA 6 pra varrer todo dia (manda que eu adiciono)

# Série de reacts: a máquina busca, nos dias de cada evento, clipes com estas palavras no título
# (dos streamers da lista e de qualquer streamer do idioma do canal). Clipes da Twitch não expiram.
# Rode pelo workflow "Série de reacts". Para um evento novo, é só acrescentar aqui.
series:
  palavras: ["gta", "trailer", "rockstar", "lucia", "jason", "vice city", "leonida", "adiad", "adiamento", "lançamento", "pré-venda", "pre load", "pré-carregamento"]
  min_views: 200
  eventos:
    - { nome: "Trailer 1 do GTA 6",              inicio: "2023-12-04", fim: "2023-12-08" }
    - { nome: "adiamento do GTA 6",              inicio: "2025-05-02", fim: "2025-05-05" }
    - { nome: "Trailer 2 do GTA 6",              inicio: "2025-05-06", fim: "2025-05-10" }
    - { nome: "novo adiamento do GTA 6",         inicio: "2025-11-06", fim: "2025-11-09" }
    - { nome: "trailer de lançamento do GTA 6",  inicio: "2026-10-15", fim: "2026-10-19" }
    - { nome: "pré-carregamento do GTA 6",       inicio: "2026-11-10", fim: "2026-11-14" }

# Quantas horas para trás procurar clipes a cada rodada (72 no aquecimento, 24 depois do lançamento)
janela_busca_horas: 72

# Um "momento" só vira vídeo se tiver pelo menos isto:
momento_minimo:
  clipes: 2            # clipes diferentes no mesmo trecho da live...
  views: 40            # ...somando pelo menos estas views
  um_clipe_views: 60   # ou 1 clipe sozinho com estas views (pré-lançamento: lives de GTA fracas; a nota do Claude filtra o resto)

# ------------------------------------------------------------
#  MODO LANÇAMENTO DO GTA 6 (liga sozinho no dia "data", horário de Brasília)
#  Todo mundo vai jogar GTA 6 ao mesmo tempo: mais Shorts, busca mais curta e mais seletiva.
#  Para testar antes: rode a "Rodada" com a opção "modo lançamento" ligada.
# ------------------------------------------------------------
lancamento:
  data: "2026-11-18"             # antecipado: a galera já está em live de GTA 6
  janela_busca_horas: 24
  max_por_rodada: 4
  momento_minimo: { clipes: 2, views: 25, um_clipe_views: 120, quentes: 5 }   # live no ar: clipe novo tem pouca view; 5+ pessoas clipando = momento forte
  nota_minima: 4                 # mais material bom no lançamento: aceita nota um pouco menor
  max_por_streamer_dia: 3
  jogos: ["Grand Theft Auto VI"]   # no lançamento é só GTA 6
  canais:
    br:
      horarios: ["08:00", "09:30", "11:00", "12:30", "14:00", "15:30", "17:00", "18:30", "20:00", "21:30", "23:00", "00:30"]   # 12 Shorts por dia na semana do lançamento
      descobrir_min_views: 300   # com muita gente jogando, só os clipes mais vistos
      descobrir_jogos: ["Grand Theft Auto VI"]

# Duração do Short final (segundos)
duracao:            # ação rápida: 15 a 30 s; conversa/react que fecha a ideia: até 55 s (a IA decide)
  minimo: 12
  maximo: 55

# Curadoria: o Claude dá nota (0 a 9) vendo o vídeo: entende sem contexto + tem desfecho + emoção (0 a 3 cada).
# Abaixo da nota mínima o momento é descartado ANTES de gastar tempo montando o vídeo.
nota_minima: 5
# Diversidade: no máximo isto de Shorts do mesmo streamer por dia (e nunca dois em menos de 6 h)
max_por_streamer_dia: 2

# Quantos Shorts produzir por rodada, em cada canal (a máquina roda a cada 3 horas)
max_por_rodada: 3

# IA gratuita (Ollama roda dentro do GitHub Actions). Se falhar, a máquina usa regras simples.
ia:
  modelo: "qwen2.5:3b"
  endereco: "http://127.0.0.1:11434"

# Transcrição (faster-whisper): tiny, base, small. "small" = melhor qualidade, mais lento
whisper: "small"

# ------------------------------------------------------------
#  CANAIS
#  modo: "revisao"    -> sobe como PRIVADO, você assiste e publica no YouTube Studio
#        "automatico" -> sobe AGENDADO nos horários abaixo
#  ativo: false       -> a máquina ignora o canal
# ------------------------------------------------------------
canais:
  - id: br
    nome: "Corte City"
    ativo: true
    modo: revisao
    idioma: pt
    marca: assets/marca/cc.png       # monograma CC da identidade Vice
    cor_destaque: "#FF3D7F"   # rosa neon da identidade Vice
    fuso: "America/Sao_Paulo"
    horarios: ["12:00", "18:00", "21:30"]   # curadoria: 3 Shorts bons por dia (no lançamento vira 8)
    horario_compilado: "19:30"   # Melhores do Dia (vídeo longo)
    horario_longo: "15:00"       # Corte longo (um momento com a live inteira em volta)
    hashtags: ["#gta6", "#gtavi", "#shorts"]
    # postar: "manual" = a máquina deixa pronto e você posta | "automatico" = a máquina envia agendado nos horários
    postar: automatico
    # Além da lista abaixo, procura os clipes mais vistos desses jogos de QUALQUER streamer que fale o idioma do canal
    descobrir:
      jogos: ["Grand Theft Auto V", "Grand Theft Auto VI"]
      idioma: pt
      min_views: 80
    playlists:
      shorts: "Melhores Momentos de GTA 6"
      gta6: "GTA 6: Reações e Primeiros Momentos"
      rp: "GTA RP: Cortes das Lives"
      classicos: "Clássicos do GTA"
      noticias: "GTA 6: Notícias"
      comunidade: "GTA 6: O Que a Comunidade Tá Postando"
      compilado: "Melhores Momentos de GTA 6"
      top10: "Top 10 da Semana"
      gringos: "Gringos no GTA 6 (legendado)"
    streamers:
      # login = nome na URL da Twitch (twitch.tv/LOGIN)
      - { login: coringa,        nome: "Coringa" }
      - { login: paulinholokobr, nome: "Paulinho O Loko" }
      - { login: luquet4,        nome: "LuquEt4" }
      - { login: cerol,          nome: "Cerol" }
      - { login: alanzoka,       nome: "Alanzoka" }
      - { login: jonvlogs,       nome: "Jon Vlogs" }
      - { login: nobru,          nome: "Nobru" }
    # Quem faz live na Kick (login = nome na URL: kick.com/LOGIN).
    # Só funciona com a chave KICK_API_KEY nos Secrets do GitHub; sem ela, é ignorado.
    kick:
      - { login: coringa,        nome: "Coringa" }
    # Quadro "gringos": rage e reação dos streamers gringos no GTA 6, com o áudio original e legenda em
    # português, no estilo post do Twitter (texto em cima, vídeo embaixo). Twitch + lives do YouTube.
    gringos:
      ligado: true
      por_dia: 4
      twitch:
        - { login: kaicenat,      nome: "Kai Cenat" }
        - { login: xqc,           nome: "xQc" }
        - { login: jasontheween,  nome: "JasonTheWeen" }
        - { login: caseoh_,       nome: "CaseOh" }
        - { login: jynxzi,        nome: "Jynxzi" }
        - { login: stableronaldo, nome: "Stable Ronaldo" }
        - { login: lacy,          nome: "Lacy" }
        - { login: summit1g,      nome: "summit1g" }
      youtube: ["@IShowSpeed"]   # lives encerradas de GTA desses canais (o robô do Mac acha os picos)
      min_views: 1500            # clipe gringo tem muita view: régua mais alta que a dos BR
      um_clipe_views: 6000
      quentes: 12

  - id: en
    nome: "Clip City"
    ativo: true                # ligado em 18/11 (lançamento do GTA 6)
    modo: revisao
    idioma: en
    marca: assets/marca/marca_en.png
    cor_destaque: "#2EE6FF"
    fuso: "America/New_York"
    horarios: ["13:00", "17:00", "20:00"]
    horario_compilado: "19:00"
    hashtags: ["#gta6", "#gtavi", "#shorts"]
    postar: automatico
    descobrir:
      jogos: ["Grand Theft Auto V", "Grand Theft Auto VI"]
      idioma: en
      min_views: 1000
    playlists:
      shorts: "Best GTA 6 Moments"
      gta6: "GTA 6: Reactions and First Moments"
      rp: "GTA RP: Stream Clips"
      classicos: "GTA Classics"
      noticias: "GTA 6: News"
      comunidade: "GTA 6: What the Community Is Posting"
      compilado: "Best GTA 6 Moments"
      top10: "Top 10 of the Week"
    streamers:
      - { login: kaicenat,     nome: "Kai Cenat" }
      - { login: xqc,          nome: "xQc" }
      - { login: jasontheween, nome: "JasonTheWeen" }
      - { login: caseoh_,      nome: "CaseOh" }
      - { login: jynxzi,       nome: "Jynxzi" }
      - { login: summit1g,     nome: "summit1g" }

# Streamers bloqueados (reclamaram ou pediram remoção). Nunca mais são cortados.
# Para bloquear, use o botão "Controle" no GitHub Actions (ele edita esta lista sozinho).
bloqueados: []
