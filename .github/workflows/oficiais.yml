name: Imagens oficiais da Rockstar (screenshots em alta)
on: workflow_dispatch
permissions: { contents: write }
env:
  # vídeos ficam no repositório privado de arquivos (se configurado); o código continua público
  ARQUIVOS_REPO: ${{ vars.ARQUIVOS_REPO }}
  ARQUIVOS_TOKEN: ${{ secrets.ARQUIVOS_TOKEN }}

jobs:
  oficiais:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - env: { GH_TOKEN: "${{ secrets.ARQUIVOS_TOKEN || github.token }}", GH_REPO: "${{ vars.ARQUIVOS_REPO || github.repository }}" }
        run: |
          mkdir -p of && cd of
          python3 -u - <<'PY'
          import re, requests, json, time
          from playwright.sync_api import sync_playwright
          achados = {}
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1920, "height": 1080})
              def pega(resp):
                  u = resp.url
                  if re.search(r"\.(jpe?g|png|webp)", u) and ("rockstargames" in u or "akamaized" in u):
                      achados[re.sub(r"\?.*$", "", u)] = u
              pg.on("response", pega)
              pg.goto("https://www.rockstargames.com/VI/downloads/screenshots", wait_until="networkidle", timeout=90000)
              for _ in range(30):
                  pg.mouse.wheel(0, 2000); time.sleep(0.3)
              links = pg.eval_on_selector_all("a", "els => els.map(e => e.href)")
              print("links com screenshot:", [l for l in links if "screenshot" in l.lower()][:20])
              imgs = pg.eval_on_selector_all("img", "els => els.map(e => [e.currentSrc, e.srcset, e.naturalWidth])")
              print("imgs:", len(imgs)); print(json.dumps(imgs[:15], indent=0)[:3000])
              # clica em cada miniatura da galeria e espera a imagem grande
              alvos = pg.query_selector_all("main img")
              print("miniaturas:", len(alvos))
              for k, el in enumerate(alvos[:160]):
                  try:
                      el.scroll_into_view_if_needed(timeout=3000); el.click(timeout=3000); time.sleep(1.2)
                      pg.keyboard.press("Escape"); time.sleep(0.3)
                  except Exception: pass
              b.close()
          print("urls únicas:", len(achados))
          json.dump(sorted(achados.values()), open("urls.json", "w"), indent=1)
          n = 0
          for base, u in achados.items():
              grande = re.sub(r"imwidth=\d+", "imwidth=3840", u) if "imwidth" in u else u + ("&" if "?" in u else "?") + "imwidth=3840"
              for cand in (grande, u):
                  try:
                      r = requests.get(cand, timeout=60)
                      if r.ok and r.headers.get("content-type", "").startswith("image") and len(r.content) > 250_000:
                          nome = re.sub(r"[^\w.-]", "_", base.split("/")[-1])
                          open(f"of_{n:03d}_{nome}", "wb").write(r.content); n += 1
                          break
                  except Exception: pass
          print("baixadas", n)
          PY
          ls | head -50; du -sh .
          gh release view oficiais >/dev/null 2>&1 || gh release create oficiais -t "Imagens oficiais da Rockstar" -n "Screenshots e artes oficiais de GTA VI em alta resolução"
          gh release upload oficiais of_* urls.json --clobber
