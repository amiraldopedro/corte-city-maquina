name: Compilado (Melhores do Dia / Top 10)

on:
  schedule:
    - cron: "41 20 * * *"   # todo dia 17:41 de Brasília -> Melhores do Dia
    - cron: "23 13 * * 0"   # domingo 10:23 de Brasília -> Top 10 da Semana
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qual vídeo longo"
        type: choice
        options: [dia, top10]
        default: dia

permissions:
  contents: write

concurrency:
  group: maquina
  cancel-in-progress: false

jobs:
  compilado:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Montar e postar
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
        run: |
          TIPO="${{ inputs.tipo }}"
          if [ -z "$TIPO" ]; then
            if [ "${{ github.event.schedule }}" = "23 13 * * 0" ]; then TIPO=top10; else TIPO=dia; fi
          fi
          python main.py compilado "$TIPO"
      - name: Salvar memória da máquina
        if: always()
        run: |
          python main.py sincronizar "Compilado: estado atualizado"
