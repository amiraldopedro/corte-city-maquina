name: Compilado (Melhores do Dia / Top 10)

on:
  schedule:
    - cron: "17 2 19-30 11 *"   # lançamento: todo dia 23:17 de Brasília -> Melhores do Dia (posta às 10h do dia seguinte)
    - cron: "23 13 * * 0"   # domingo 10:23 de Brasília -> Top 10 da Semana
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qual vídeo longo"
        type: choice
        options: [dia, longo, top10, serie]
        default: dia
      evento:
        description: "Para tipo serie: nome do evento (ex.: Trailer 2 do GTA 6)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: compilado
  cancel-in-progress: false

env:
  # vídeos ficam no repositório privado de arquivos (se configurado); o código continua público
  ARQUIVOS_REPO: ${{ vars.ARQUIVOS_REPO }}
  ARQUIVOS_TOKEN: ${{ secrets.ARQUIVOS_TOKEN }}

jobs:
  compilado:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q demucs

      - name: Guardar modelos baixados (IA, transcrição e separador de voz)
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper
            .cache/torch
          key: modelos-longo-${{ hashFiles('config.yaml') }}
          restore-keys: |
            modelos-longo-
            modelos-

      - name: Ligar o Claude (se a chave CLAUDE_CODE_OAUTH_TOKEN estiver nos Secrets)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then (curl -fsSL https://claude.ai/install.sh | bash >/dev/null 2>&1 && echo "$HOME/.local/bin" >> "$GITHUB_PATH" || npm install -g @anthropic-ai/claude-code 2>&1 | tail -3) && echo "Claude ligado" || echo "Claude não instalou agora: usando o Ollama"; else echo "Sem chave do Claude: usando só o Ollama"; fi
      - name: Montar e postar
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
          GITHUB_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          WHISPER_CACHE: ${{ github.workspace }}/.cache/whisper
          TORCH_HOME: ${{ github.workspace }}/.cache/torch
          OLLAMA_MODELS: /home/runner/.ollama/models
          TIPO_PEDIDO: ${{ inputs.tipo }}
          EVENTO: ${{ inputs.evento }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          TIPO="$TIPO_PEDIDO"
          if [ -z "$TIPO" ]; then
            if [ "$AGENDA" = "23 13 * * 0" ]; then TIPO=top10
            else TIPO=dia; fi
          fi
          for T in $TIPO; do
            python main.py compilado "$T" --evento "$EVENTO" || echo "::warning::$T falhou"
          done
      - name: Salvar memória da máquina
        if: always()
        run: |
          python main.py sincronizar "Compilado: estado atualizado"
