name: Rodada (caçar + Shorts)

# A cada 4 horas: consulta a Twitch, guarda os momentos novos e, se a meta do dia
# ainda não foi cumprida, monta e posta um Short por canal ativo.
on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "17 2-23/4 19-30 11 *"   # semana do lançamento do GTA 6: rodada a cada 2 horas
  workflow_dispatch:
    inputs:
      teste:
        description: "Modo teste: aceita clipe de qualquer jogo e faz 1 Short [TESTE]"
        type: boolean
        default: false
      quantos:
        description: "Quantos Shorts fazer nesta rodada (máximo = meta do dia)"
        type: choice
        options: ["3", "2", "1"]
        default: "3"
      lancamento:
        description: "Forçar o modo lançamento do GTA 6 (pra testar antes do dia 19)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maquina
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      KICK_API_KEY: ${{ secrets.KICK_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      WHISPER_CACHE: ${{ github.workspace }}/.cache/whisper
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
      OLLAMA_MODELS: /home/runner/.ollama/models
      MODO_TESTE: ${{ inputs.teste && '1' || '0' }}
      QUANTOS: ${{ inputs.quantos || '' }}
      MODO_LANCAMENTO: ${{ inputs.lancamento && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Caçar clipes na Twitch
        run: |
          pip install -q -r requirements-leve.txt
          if [ -z "$TWITCH_CLIENT_ID" ]; then echo "Chaves da Twitch ainda não configuradas — pulando."; exit 0; fi
          python main.py cacar
          python main.py numeros

      - name: Tem Short para fazer agora?
        id: fila
        run: echo "tem=$(python main.py fila)" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas de vídeo
        if: steps.fila.outputs.tem == 'sim'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Guardar modelos baixados (IA e transcrição)
        if: steps.fila.outputs.tem == 'sim'
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.ollama/models
            .cache/whisper
            .cache/torch
          key: modelos-${{ hashFiles('config.yaml') }}
          restore-keys: modelos-

      - name: Ligar a IA gratuita (Ollama)
        if: steps.fila.outputs.tem == 'sim'
        continue-on-error: true   # se falhar, a máquina usa o plano B com regras
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          MODELO=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['ia']['modelo'])")
          ollama pull "$MODELO"

      - name: Ligar o Claude (se a chave CLAUDE_CODE_OAUTH_TOKEN estiver nos Secrets)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then (npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || (sleep 20; npm install -g @anthropic-ai/claude-code >/dev/null 2>&1)) && echo "Claude ligado" || echo "Claude não instalou agora: usando o Ollama"; else echo "Sem chave do Claude: usando só o Ollama"; fi
      - name: Produzir e postar
        if: steps.fila.outputs.tem == 'sim'
        run: python main.py produzir

      - name: Salvar memória da máquina
        if: always()
        run: |
          python main.py sincronizar "Rodada: estado atualizado"
