name: Diagnóstico (busca de imagens)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install -q yt-dlp
      - run: |
          for q in "ytsearch3:WPTV huge gator removed Palm Beach Gardens swimming pool" "ytsearch3:Florida man alligator beer run Jacksonville convenience store" "ytsearch3:12 foot alligator Coconut Point Mall Estero"; do
            yt-dlp --flat-playlist --print "%(id)s | %(channel)s | %(duration)s | %(title)s" "$q" || true
          done
          yt-dlp -f "b[height<=720]/b" --download-sections "*5-10" -o /tmp/t.mp4 "ytsearch1:WPTV huge gator removed Palm Beach Gardens swimming pool" 2>&1 | tail -3; ls -la /tmp/t.mp4 || true
