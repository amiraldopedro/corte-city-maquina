name: Diagnóstico (busca de imagens)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: pip install -q -r requirements-leve.txt pillow
      - run: |
          python - <<'PY'
          import sys, traceback, requests
          sys.path.insert(0, ".")
          from pathlib import Path
          from maquina import visuais as V
          orig = requests.get
          def espia(*a, **k):
              r = orig(*a, **k); print("GET", r.status_code, a[0][:90]); return r
          V.requests.get = espia
          P = Path("/tmp/m"); P.mkdir(exist_ok=True)
          for b in ["American alligator Florida", "Everglades airboat"]:
              try:
                  print(b, "->", V.commons(b, P))
              except Exception:
                  traceback.print_exc()
          PY
