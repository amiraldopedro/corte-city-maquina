name: YouTube (vídeos que você manda pelo painel)

on:
  schedule:
    - cron: "7 */3 * * *"   # a cada 3 h: vídeos de GTA mais vistos + lives encerradas + Shorts pra modelar (cada caça tem limite por dia)
  workflow_dispatch:
    inputs:
      acao:
        description: "pedir = links p/ cortes | modelo = links de Shorts/TikTok/Reels pra refazer com voz nossa | processar = trechos baixados viram cortes"
        type: choice
        options: [pedir, biblioteca, modelo, gringo, processar, auto]
        default: pedir
      links:
        description: "Links de vídeos/lives do YouTube (separados por espaço)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube
  cancel-in-progress: false

env:
  # vídeos ficam no repositório privado de arquivos (se configurado); o código continua público
  ARQUIVOS_REPO: ${{ vars.ARQUIVOS_REPO || 'amiraldopedro/corte-city-arquivos' }}
  ARQUIVOS_TOKEN: ${{ secrets.ARQUIVOS_TOKEN || secrets.ARQUIVOS_REPO }}

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -q -r requirements-leve.txt
      - name: Pedir ou processar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINKS: ${{ inputs.links }}
          ACAO: ${{ inputs.acao || 'auto' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
        run: |
          if [ "$ACAO" = "auto" ]; then
            python main.py youtube_auto
            python main.py modelar
          elif [ "$ACAO" = "processar" ]; then
            python main.py youtube_processar
          else
            if [ "$ACAO" = "biblioteca" ] || [ "$ACAO" = "modelo" ] || [ "$ACAO" = "gringo" ]; then MODO=$ACAO; else MODO=cortes; fi
            python main.py youtube_pedir --links "$LINKS" --evento "$MODO"
          fi
      - name: Salvar memória da máquina
        run: python main.py sincronizar "YouTube - fila atualizada"
      - name: Chamar a rodada pra fazer os cortes
        if: inputs.acao == 'processar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rodada.yml -f quantos=3 || true
          if [ -f /tmp/tem_longo ]; then gh workflow run compilado.yml -f tipo=longo || true; fi
