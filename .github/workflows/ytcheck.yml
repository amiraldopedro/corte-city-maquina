name: Conferir vídeos no YouTube
on:
  workflow_dispatch:
    inputs:
      ids: { description: "IDs separados por vírgula", required: true }
env:
  # vídeos ficam no repositório privado de arquivos (se configurado); o código continua público
  ARQUIVOS_REPO: ${{ vars.ARQUIVOS_REPO || 'amiraldopedro/corte-city-arquivos' }}
  ARQUIVOS_TOKEN: ${{ secrets.ARQUIVOS_TOKEN || secrets.ARQUIVOS_REPO }}

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -q -r requirements-leve.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
          IDS: ${{ inputs.ids }}
        run: |
          python - <<'PY'
          import os, json
          from maquina.config import carregar
          from maquina.youtube import YouTube
          cfg = carregar()
          canal = next(c for c in cfg.canais_ativos() if c.idioma == "pt")
          yt = YouTube(cfg.yt_client_id, cfg.yt_client_secret, canal.refresh_token)
          r = yt.yt.videos().list(part="status,processingDetails,snippet", id=os.environ["IDS"]).execute()
          achados = {v["id"] for v in r.get("items", [])}
          for v in r.get("items", []):
              print(v["id"], json.dumps(v.get("status")), json.dumps(v.get("processingDetails", {}).get("processingStatus")), v["snippet"]["title"][:60])
          for i in os.environ["IDS"].split(","):
              if i not in achados: print(i, "NÃO ENCONTRADO")
          PY
