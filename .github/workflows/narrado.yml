name: Vídeo longo narrado (posta agendado no YouTube)

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Número do roteiro em roteiros/longos (ex.: 001)"
        default: "001"
      postar:
        description: "Postar no YouTube (agendado)? sim/nao"
        default: "sim"

permissions:
  contents: write

concurrency:
  group: narrado
  cancel-in-progress: false

jobs:
  narrado:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          pip install -q yt-dlp
      - name: Montar o vídeo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ROTEIRO_ID: ${{ inputs.id }}
          POSTAR: ${{ inputs.postar }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
        run: python main.py narrado "$ROTEIRO_ID"
      - name: Salvar memória da máquina
        if: always()
        run: python main.py sincronizar "Narrado - estado atualizado"
