name: Envios pendentes (logo depois que a cota do YouTube renova)

on:
  workflow_dispatch:
  schedule:
    - cron: "12 8 * * *"

permissions:
  contents: write

concurrency:
  group: pendentes
  cancel-in-progress: false

jobs:
  pendentes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Subir o que esperava cota
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BR: ${{ secrets.YT_REFRESH_TOKEN_BR }}
        run: python main.py pendentes
      - name: Salvar memória da máquina
        if: always()
        run: python main.py sincronizar "Pendentes - estado atualizado"
