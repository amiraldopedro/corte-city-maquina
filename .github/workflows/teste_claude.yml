name: Teste do Claude

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Preparar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH" || npm install -g @anthropic-ai/claude-code
      - name: Claude lendo texto e vendo imagem
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d ' \r\n')"
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::error::Segredo do Claude vazio ou inexistente"; exit 1; fi
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30" -f lavfi -i "sine=frequency=300" -t 20 -shortest /tmp/teste.mp4
          python - <<'PY'
          from pathlib import Path
          from maquina import cerebro
          from maquina.kit import folhas_de_quadros
          folhas = folhas_de_quadros(Path("/tmp/teste.mp4"), 0, 20, Path("/tmp/folhas"))
          r = cerebro._perguntar_ollama("", "", 'Descreva em português, numa frase, o que aparece nos quadros e diga o segundo do último quadro. Responda {"descricao": "...", "ultimo_segundo": 0}', folhas)
          print("RESPOSTA:", r)
          PY
