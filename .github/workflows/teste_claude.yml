name: Teste do Claude

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Conferir a chave e perguntar algo pro Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_AMI_PERSONAL }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::error::Segredo CLAUDE_CODE_OAUTH_TOKEN vazio ou inexistente"; exit 1; fi
          echo "Chave encontrada (${#CLAUDE_CODE_OAUTH_TOKEN} caracteres, começa com ${CLAUDE_CODE_OAUTH_TOKEN:0:12}...)"
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          echo 'Responda só: {"ok": true, "frase": "<uma frase curta e engraçada sobre GTA 6 em português>"}' | claude -p --output-format text --model sonnet --max-turns 1
